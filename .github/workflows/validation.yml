name: Validation Windows et Linux

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CAHPP_REQUIRE_GUI: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python tools/release_checks.py
      - run: python -m compileall -q cahpp_app tests
      - name: Écran virtuel Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth python3-tk
      - name: Tests Linux avec interface
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Tests Windows avec interface
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Vérifier le packaging Windows
        if: runner.os == 'Windows'
        run: python -m PyInstaller CommandesCAHPP.spec --noconfirm --clean
