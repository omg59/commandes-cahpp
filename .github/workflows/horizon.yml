name: Horizon — Windows et Linux

on:
  push:
    branches: [feature/horizon-ui]
  pull_request:
    branches: [feature/horizon-ui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  horizon:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CAHPP_REQUIRE_HORIZON_GUI: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-horizon.txt
      - run: python -m pip install -r requirements-horizon.txt -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python tools/release_checks.py
      - run: python -m compileall -q cahpp_app tests main_horizon.py
      - name: Dépendances graphiques Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libegl1 libgl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-shape0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libdbus-1-3 libfontconfig1 libfreetype6 desktop-file-utils
      - name: Tous les tests Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Tous les tests Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Réutiliser les outils AppImage vérifiés
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: .cache-horizon-build
          key: horizon-appimage-tools-${{ runner.os }}-${{ hashFiles('tools/build_horizon_linux.py') }}
      - name: Construire le portable Linux et l'AppImage
        if: runner.os == 'Linux'
        run: python -m tools.build_horizon_linux --skip-tests
      - name: Vérifier les paquets Linux sans FUSE
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m tools.check_horizon_linux --platform xcb
      - name: Mettre les paquets Linux à disposition
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: CommandesCAHPP-Horizon-Linux-x86_64
          path: |
            dist-linux/*.AppImage
            dist-linux/*.tar.gz
            dist-linux/*.json
            dist-linux/SHA256SUMS
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Construire Horizon Windows
        if: runner.os == 'Windows'
        run: python -m PyInstaller Horizon.spec --noconfirm --clean
      - name: Démarrer l'EXE et vérifier les ressources françaises
        if: runner.os == 'Windows'
        shell: python
        run: |
          import json, os, sqlite3, subprocess, tempfile
          from contextlib import closing
          from pathlib import Path
          import runpy
          VERSION = runpy.run_path('cahpp_app/horizon/__init__.py')['VERSION']
          exe = Path('dist/CommandesCAHPP-Horizon-portable/CommandesCAHPP-Horizon.exe').resolve()
          with tempfile.TemporaryDirectory() as profile:
              env = dict(os.environ, CAHPP_HORIZON_ROOT=str(Path(profile)/'selection'))
              subprocess.run([str(exe), '--profile', profile, '--smoke-test'], env=env, check=True, timeout=40)
              report = json.loads((Path(profile)/'startup-ok.json').read_text())
              assert report['version'] == VERSION and report['qt_translated'], report
              with closing(sqlite3.connect(Path(profile)/'data/commandes_cahpp.sqlite3')) as db:
                  assert db.execute('SELECT COUNT(*) FROM products').fetchone()[0] == 0
                  assert db.execute('SELECT COUNT(*) FROM orders').fetchone()[0] == 0
              (Path(profile)/'startup-ok.json').unlink()
              subprocess.run([str(exe), '--smoke-test'], env=env, check=True, timeout=40)
              assert (Path(profile)/'startup-ok.json').is_file()
      - name: Mettre le dossier Windows à disposition
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: CommandesCAHPP-Horizon-Windows
          path: dist/CommandesCAHPP-Horizon-portable/
          if-no-files-found: error
          retention-days: 30
      - name: Construire l'installeur Horizon séparé
        if: runner.os == 'Windows'
        shell: cmd
        run: build_horizon_installer.bat --skip-build
      - name: Vérifier installation, mise à jour et désinstallation isolées
        if: runner.os == 'Windows'
        shell: python
        run: |
          import json, os, subprocess, tempfile
          from pathlib import Path
          import runpy
          VERSION = runpy.run_path('cahpp_app/horizon/__init__.py')['VERSION']
          setup = Path(f'dist-installer-horizon/CommandesCAHPP-Horizon-Setup-{VERSION}.exe').resolve()
          with tempfile.TemporaryDirectory() as folder:
              root = Path(folder)
              target = root / 'programme'
              profile = root / 'profils' / 'essai'
              options = [str(setup), '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=', '/DIR='+str(target)]
              subprocess.run(options, check=True, timeout=120)
              exe = target / 'CommandesCAHPP-Horizon.exe'
              assert exe.is_file()
              subprocess.run([str(exe), '--profile', str(profile), '--smoke-test'], check=True, timeout=45)
              marker = profile / 'conservation-test.txt'
              marker.write_text('conserver', encoding='utf-8')
              subprocess.run(options, check=True, timeout=120)
              assert marker.read_text(encoding='utf-8') == 'conserver'
              subprocess.run([str(exe), '--profile', str(profile), '--smoke-test'], check=True, timeout=45)
              subprocess.run([str(target/'unins000.exe'), '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'], check=True, timeout=120)
              assert marker.read_text(encoding='utf-8') == 'conserver'
      - name: Mettre l'installeur Windows à disposition
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: CommandesCAHPP-Horizon-Installer-Windows
          path: dist-installer-horizon/*.exe
          if-no-files-found: error
          retention-days: 30
