name: Horizon — validation et Windows

on:
  push:
    branches: [feature/horizon-ui]
  pull_request:
    paths:
      - cahpp_app/horizon/**
      - main_horizon.py
      - Horizon.spec
      - Horizon.iss
      - build_horizon_installer.bat
      - requirements-horizon.txt
      - tests/*horizon*
      - ressources/horizon/**
      - .github/workflows/horizon.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  horizon:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CAHPP_REQUIRE_GUI: "1"
      CAHPP_REQUIRE_HORIZON_GUI: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-horizon.txt
      - run: python -m pip install -r requirements-horizon.txt -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python tools/release_checks.py
      - run: python -m compileall -q cahpp_app tests main_horizon.py
      - name: Dépendances graphiques Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth python3-tk libegl1
      - name: Tous les tests Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Tous les tests Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Construire Horizon Windows
        if: runner.os == 'Windows'
        run: python -m PyInstaller Horizon.spec --noconfirm --clean
      - name: Démarrer l'EXE et vérifier les ressources françaises
        if: runner.os == 'Windows'
        shell: python
        run: |
          import json, subprocess, tempfile
          from pathlib import Path
          exe = Path('dist/CommandesCAHPP-Horizon-portable/CommandesCAHPP-Horizon.exe').resolve()
          with tempfile.TemporaryDirectory() as profile:
              subprocess.run([str(exe), '--profile', profile, '--smoke-test'], check=True, timeout=40)
              report = json.loads((Path(profile)/'startup-ok.json').read_text())
              assert report['version'] == '2.0.0a2' and report['qt_translated'], report
      - name: Mettre le dossier Windows à disposition
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: CommandesCAHPP-Horizon-Windows
          path: dist/CommandesCAHPP-Horizon-portable/
          if-no-files-found: error
          retention-days: 30
      - name: Construire l'installeur Horizon séparé
        if: runner.os == 'Windows'
        shell: cmd
        run: build_horizon_installer.bat --skip-build
      - name: Vérifier installation, mise à jour et désinstallation isolées
        if: runner.os == 'Windows'
        shell: python
        run: |
          import json, os, subprocess, tempfile
          from pathlib import Path
          setup = Path('dist-installer-horizon/CommandesCAHPP-Horizon-Setup-2.0.0a2.exe').resolve()
          with tempfile.TemporaryDirectory() as folder:
              root = Path(folder)
              target = root / 'programme'
              profile = root / 'profils' / 'essai'
              options = [str(setup), '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=', '/DIR='+str(target)]
              subprocess.run(options, check=True, timeout=120)
              exe = target / 'CommandesCAHPP-Horizon.exe'
              assert exe.is_file()
              subprocess.run([str(exe), '--profile', str(profile), '--smoke-test'], check=True, timeout=45)
              marker = profile / 'conservation-test.txt'
              marker.write_text('conserver', encoding='utf-8')
              subprocess.run(options, check=True, timeout=120)
              assert marker.read_text(encoding='utf-8') == 'conserver'
              subprocess.run([str(exe), '--profile', str(profile), '--smoke-test'], check=True, timeout=45)
              subprocess.run([str(target/'unins000.exe'), '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'], check=True, timeout=120)
              assert marker.read_text(encoding='utf-8') == 'conserver'
      - name: Mettre l'installeur Windows à disposition
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: CommandesCAHPP-Horizon-Installer-Windows
          path: dist-installer-horizon/*.exe
          if-no-files-found: error
          retention-days: 30
