name: Publier une version Horizon validée

on:
  push:
    branches: [main]
    paths: [.github/releases/horizon.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: horizon-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'omg59/horizon-pc' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Vérifier les garde-fous de publication
        run: python -m unittest tests.test_horizon_release -v
      - name: Publier les artefacts approuvés, sans recompilation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/publish_horizon_release.py .github/releases/horizon.json
